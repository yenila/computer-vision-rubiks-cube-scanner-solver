services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rubiks_scanner
      POSTGRES_USER: rubiks
      POSTGRES_PASSWORD: rubiks
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rubiks -d rubiks_scanner"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://rubiks:rubiks@postgres:5432/rubiks_scanner?schema=public
      JWT_SECRET: replace-with-a-long-random-secret
      JWT_EXPIRES_IN: 7d
      CORS_ORIGIN: http://localhost:8080
      PORT: 4000
    ports:
      - "4000:4000"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: http://localhost:4000/api
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  postgres_data:
